[package]
name = "venera"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
base64 = "0.22.1"
blake3 = "1.8.7"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
getrandom = "0.2.16"
keyring = "4.2.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
quick-xml = "0.42.0"
ratatui = "0.30.2"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "json", "stream", "http2", "charset"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
textwrap = "0.16.4"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
zeroize = "1.9.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

