name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" releases/*.zip \
            --title "Venera $GITHUB_REF_NAME" \
            --notes "Venera $GITHUB_REF_NAME. Archives: Linux, macOS, Windows."
